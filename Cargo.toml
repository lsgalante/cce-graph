[package]
name = "cce-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "7310ddf5f2dc1f2f4434163ed0d53819728a7e68" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", features = ["png", "jpeg"] }
kdl = "4.6"
rfd = "0.15"
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "2d49246a84824dc10d99b04d6ea6472e8aa9f2e7" }

[dev-dependencies]
tempfile = "3"


[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): geometry, colour and paint state
# taken piecewise, and the legacy tuple views.
type_complexity = "allow"
